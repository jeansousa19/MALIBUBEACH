<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos - Arena Sports Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 flex flex-col lg:flex-row min-h-screen font-sans">

    <aside class="w-full lg:w-64 bg-slate-900 text-white p-4 lg:p-6 flex flex-col justify-between shadow-md sticky top-0 z-40">
        <div class="flex lg:flex-col justify-between items-center lg:items-stretch w-full">
            <div class="text-center lg:mb-8 lg:border-b lg:border-slate-700 lg:pb-4">
                <h1 class="text-xl lg:text-2xl font-extrabold text-orange-500 tracking-wider">ARENA</h1>
            </div>
            <nav class="flex lg:flex-col gap-1 sm:gap-2">
                <a href="dashboard.html" class="flex items-center space-x-1.5 text-slate-300 hover:bg-slate-800 px-3 py-2 rounded-xl font-medium text-xs sm:text-sm lg:text-base"><span>📊</span> <span>Painel</span></a>
                <a href="alunos.html" class="flex items-center space-x-1.5 bg-orange-600 text-white px-3 py-2 rounded-xl font-bold text-xs sm:text-sm lg:text-base"><span>👥</span> <span>Alunos</span></a>
                <a href="relatorio.html" class="flex items-center space-x-1.5 text-slate-300 hover:bg-slate-800 px-3 py-2 rounded-xl font-medium text-xs sm:text-sm lg:text-base"><span>📈</span> <span>Caixa</span></a>
            </nav>
            <div class="lg:pt-6 lg:border-t lg:border-slate-700 flex items-center">
                <button onclick="logout()" class="text-xs lg:text-sm text-red-400 hover:text-red-300 font-bold flex items-center gap-1 cursor-pointer"><span>🚪</span> <span class="hidden lg:inline">Sair</span></button>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-4 sm:p-6 lg:p-10 space-y-6">
        <header>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800">Alunos Atletas</h2>
            <p class="text-xs sm:text-sm text-slate-500">Cadastre e analise a situação individual.</p>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-800 mb-4 pb-2 border-b">➕ Novo Cadastro</h3>
                <form id="alunoForm" class="space-y-3.5">
    <div>
        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Nome Completo</label>
        <input type="text" id="nome" required class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-orange-500 focus:outline-none">
    </div>
    <div class="grid grid-cols-2 gap-2">
        <div>
            <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">WhatsApp</label>
            <input type="tel" id="whatsapp" required class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-orange-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">E-mail</label>
            <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-orange-500 focus:outline-none">
        </div>
    </div>
    <div class="grid grid-cols-2 gap-2">
        <div>
            <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Modalidade</label>
            <select id="modalidade" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:outline-none">
                <option value="Vôlei de Praia">Vôlei de Praia</option>
                <option value="Beach Tennis">Beach Tennis</option>
                <option value="Futevôlei">Futevôlei</option>
            </select>
        </div>
        <div>
            <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Plano</label>
            <select id="plano" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:outline-none">
                <option value="Mensal">Mensal (1 Mês)</option>
                <option value="Trimestral">Trimestral (3 Meses)</option>
            </select>
        </div>
    </div>
    <div>
        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Valor da Mensalidade (R$)</label>
        <input type="number" id="valor" required class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:outline-none">
    </div>
    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-sm">Salvar Aluno</button>
</form>
            </section>

            <section class="xl:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 sm:p-6 bg-slate-50 border-b font-bold text-slate-800 text-sm sm:text-base">👥 Alunos Matriculados</div>
                
                <div class="hidden md:block w-full overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs uppercase font-bold border-b">
                                <th class="p-4">Nome / Contato</th>
                                <th class="p-4">Modalidade</th>
                                <th class="p-4">Cadastro</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaAlunosDesktop" class="text-sm divide-y text-slate-700"></tbody>
                    </table>
                </div>

                <div id="listaAlunosMobile" class="block md:hidden p-4 space-y-4 bg-slate-50/50"></div>
            </section>
        </div>

        <div id="modalAluno" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 hidden z-50">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
                <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                    <div>
                        <h3 id="modalNome" class="text-lg font-bold">--</h3>
                        <p id="modalInfoCadastro" class="text-[10px] text-slate-400 mt-0.5">--</p>
                    </div>
                    <button onclick="fecharModal()" class="text-slate-400 hover:text-white text-2xl font-bold leading-none cursor-pointer">&times;</button>
                </div>
                <div class="p-4 sm:p-6 overflow-y-auto space-y-5 flex-1">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-center">
                            <p class="text-[10px] text-emerald-700 font-bold uppercase">Pagas</p>
                            <p id="modalQtdPagas" class="text-xl font-black text-emerald-800">0</p>
                        </div>
                        <div class="bg-rose-50 p-3 rounded-xl border border-rose-200 text-center">
                            <p class="text-[10px] text-rose-700 font-bold uppercase">Em Aberto</p>
                            <p id="modalQtdAberto" class="text-xl font-black text-rose-800">0</p>
                        </div>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 mb-2 text-xs uppercase tracking-wider">Histórico Financeiro</h4>
                        
                        <div class="hidden sm:block border rounded-xl overflow-hidden bg-white">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-200 text-slate-700 font-bold border-b">
                                        <th class="p-3">Mês Ref.</th>
                                        <th class="p-3">Vencimento</th>
                                        <th class="p-3">Valor</th>
                                        <th class="p-3">Situação</th>
                                    </tr>
                                </thead>
                                <tbody id="modalTabelaDesktop" class="divide-y"></tbody>
                            </table>
                        </div>

                        <div id="modalCardsMobile" class="block sm:hidden space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let usuarioLogado = null;

        window.onload = async function() {
            usuarioLogado = verificarSessao();
            if (usuarioLogado) {
                await listarAlunos();
            }
        }

        // CADASTRO DE ALUNO + CRIAÇÃO DA PRIMEIRA PARCELA
        document.getElementById('alunoForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const botao = e.target.querySelector('button[type="submit"]');
    botao.disabled = true;
    botao.innerText = "Salvando...";

    const nome = document.getElementById('nome').value;
    const whatsapp = document.getElementById('whatsapp').value;
    const email = document.getElementById('email').value;
    const modalidade = document.getElementById('modalidade').value;
    const plano = document.getElementById('plano').value;
    const valorBase = parseFloat(document.getElementById('valor').value);
    const hoje = new Date();

    // 1. Salva o Aluno no Supabase
    const { data: alunoSalvo, error: erroAluno } = await _supabase
        .from('alunos')
        .insert([{ nome, whatsapp, email, modalidade, valor: valorBase, dataCadastro: hoje.toLocaleDateString('pt-BR') }])
        .select();

    if (erroAluno) {
        alert("Erro ao salvar aluno: " + erroAluno.message);
        botao.disabled = false;
        botao.innerText = "Salvar Aluno";
        return;
    }

    const alunoId = alunoSalvo[0].id;
    const qtdParcelas = plano === "Trimestral" ? 3 : 1;
    const pagamentosParaInserir = [];

    // 2. Gera as parcelas (1 se mensal, 3 se trimestral)
    for (let i = 0; i < qtdParcelas; i++) {
        const dataParcela = new Date(hoje.getFullYear(), hoje.getMonth() + i, 10);
        const mesRef = `${String(dataParcela.getMonth() + 1).padStart(2, '0')}/${dataParcela.getFullYear()}`;
        
        pagamentosParaInserir.push({
            alunoId: alunoId,
            mes: mesRef,
            vencimento: `10/${mesRef}`,
            status: "Pendente",
            valor: valorBase
        });
    }

    const { error: erroPagamentos } = await _supabase
        .from('pagamentos')
        .insert(pagamentosParaInserir);

    if (erroPagamentos) {
        alert("Aluno criado, mas houve erro ao gerar as mensalidades: " + erroPagamentos.message);
    } else {
        alert(`Aluno cadastrado com sucesso! Plano ${plano} ativado.`);
        document.getElementById('alunoForm').reset();
        listarAlunos(); // Função que atualiza sua tabela na tela
    }

    botao.disabled = false;
    botao.innerText = "Salvar Aluno";
});

        // LISTAGEM DE ALUNOS DO BANCO
        async function listarAlunos() {
            const tDesktop = document.getElementById('tabelaAlunosDesktop');
            const lMobile = document.getElementById('listaAlunosMobile');
            tDesktop.innerHTML = "<tr><td class='p-4 text-slate-500'>Carregando atletas...</td></tr>";
            lMobile.innerHTML = "";

            const { data: atletas, error } = await _supabase
                .from('alunos')
                .select('*')
                .order('nome', { ascending: true });

            if (error) {
                alert("Erro ao buscar dados: " + error.message);
                return;
            }

            tDesktop.innerHTML = "";
            if(atletas.length === 0) {
                tDesktop.innerHTML = "<tr><td class='p-4 text-slate-500'>Nenhum atleta matriculado.</td></tr>";
            }

            atletas.forEach(aluno => {
                // Desktop
                tDesktop.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4">
                            <div class="font-bold text-slate-800">${aluno.nome}</div>
                            <div class="text-xs text-slate-500">${aluno.whatsapp} | ${aluno.email}</div>
                        </td>
                        <td class="p-4"><span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded text-xs font-bold">${aluno.modalidade}</span></td>
                        <td class="p-4 text-slate-500 text-xs">${aluno.data_cadastro}</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="verSituacao(${aluno.id})" class="bg-blue-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium hover:bg-blue-700 transition cursor-pointer">🔍 Ver Situação</button>
                            <button onclick="excluirAluno(${aluno.id})" class="text-rose-600 text-xs font-bold hover:underline cursor-pointer">Excluir</button>
                        </td>
                    </tr>
                `;

                // Mobile
                lMobile.innerHTML += `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-extrabold text-slate-800 text-base leading-tight">${aluno.nome}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">${aluno.whatsapp}</p>
                            </div>
                            <span class="text-[10px] font-bold bg-orange-100 text-orange-700 px-2 py-0.5 rounded">${aluno.modalidade}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 font-medium">Cadastrado em: ${aluno.data_cadastro}</div>
                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
                            <button onclick="verSituacao(${aluno.id})" class="bg-blue-600 text-white text-xs py-2 rounded-xl font-bold shadow-sm text-center cursor-pointer">🔍 Ver Histórico</button>
                            <button onclick="excluirAluno(${aluno.id})" class="border border-rose-200 text-rose-600 text-xs py-2 rounded-xl font-bold text-center cursor-pointer">🗑️ Remover</button>
                        </div>
                    </div>
                `;
            });
        }

        // DETALHES FINANCEIROS INDIVIDUAIS (MODAL)
        async function verSituacao(alunoId) {
            const tModal = document.getElementById('modalTabelaDesktop');
            const cModal = document.getElementById('modalCardsMobile');
            tModal.innerHTML = "";
            cModal.innerHTML = "";

            // Busca o aluno específico
            const { data: aluno, errorA } = await _supabase.from('alunos').select('*').eq('id', alunoId).single();
            if (errorA || !aluno) return;

            document.getElementById('modalNome').innerText = aluno.nome;
            document.getElementById('modalInfoCadastro').innerText = `Cadastro: ${aluno.data_cadastro} | ${aluno.email}`;

            // Busca os pagamentos vinculados a esse aluno
            const { data: parcelas, errorP } = await _supabase.from('pagamentos').select('*').eq('aluno_id', alunoId).order('id', {ascending: false});
            if (errorP) return;

            let pagas = 0, abertas = 0;
            const hoje = new Date();

            parcelas.forEach(m => {
                let badge = "";
                if (m.status === "Pago") {
                    pagas++;
                    badge = `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">Pago ${m.data_baixa} (${m.forma_pagamento})</span>`;
                } else {
                    abertas++;
                    const [dia, mes, ano] = m.vencimento.split('/');
                    if (new Date(ano, mes - 1, dia) < hoje) {
                        badge = `<span class="bg-rose-100 text-rose-800 px-2 py-0.5 rounded text-[10px] font-bold">🔴 Vencida</span>`;
                    } else {
                        badge = `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">🟡 A Vencer</span>`;
                    }
                }

                // PC
                tModal.innerHTML += `
                    <tr>
                        <td class="p-3 font-semibold">${m.mes}</td>
                        <td class="p-3 text-slate-500">${m.vencimento}</td>
                        <td class="p-3 font-bold">R$ ${parseFloat(m.valor).toFixed(2)}</td>
                        <td class="p-3">${badge}</td>
                    </tr>
                `;

                // Mobile
                cModal.innerHTML += `
                    <div class="bg-slate-100 p-3 rounded-xl flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-slate-800">Mês: ${m.mes}</div>
                            <div class="text-[11px] text-slate-500 mt-0.5">Vence: ${m.vencimento}</div>
                        </div>
                        <div class="text-right space-y-1">
                            <div class="font-black text-slate-900">R$ ${parseFloat(m.valor).toFixed(2)}</div>
                            <div>${badge}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('modalQtdPagas').innerText = pagas;
            document.getElementById('modalQtdAberto').innerText = abertas;
            document.getElementById('modalAluno').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('modalAluno').classList.add('hidden'); }

        // EXCLUIR ATLETA
        async function excluirAluno(id) {
            if (confirm("Excluir permanentemente este atleta e todo seu histórico financeiro?")) {
                const { error } = await _supabase.from('alunos').delete().eq('id', id);
                if (error) {
                    alert("Erro ao excluir: " + error.message);
                } else {
                    alert("Atleta removido!");
                    await listarAlunos();
                }
            }
        }

        function logout() {
            localStorage.removeItem('arena_session');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
