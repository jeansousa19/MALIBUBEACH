<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arena Sports Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-orange-600">ARENA</h1>
            <p class="text-slate-500 text-sm font-medium uppercase tracking-wider">Malibu Beach</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">E-mail de Usuário</label>
                <input type="email" id="email" required placeholder="admin@arena.com" 
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-slate-50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••" 
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-slate-50">
            </div>

            <button type="submit" 
                    class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg cursor-pointer">
                Entrar no Sistema
            </button>
        </form>

        <div id="erroMsg" class="mt-4 text-center text-red-500 font-medium text-sm hidden">
            Usuário ou senha incorretos!
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erroMsg = document.getElementById('erroMsg');
            const botaoSubmit = e.target.querySelector('button[type="submit"]');

            erroMsg.classList.add('hidden');
            botaoSubmit.disabled = true;
            botaoSubmit.innerText = "Autenticando...";

            // Faz login usando a instância global '_supabase' definida no config.js
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: senha,
            });

            if (error) {
                erroMsg.innerText = "Usuário ou senha incorretos ou não cadastrados!";
                erroMsg.classList.remove('hidden');
                botaoSubmit.disabled = false;
                botaoSubmit.innerText = "Entrar no Sistema";
            } else {
                localStorage.setItem('arena_session', JSON.stringify(data.session));
                window.location.href = 'dashboard.html';
            }
        }); 
    </script>
</body>
</html>
